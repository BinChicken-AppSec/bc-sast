[package]
name = "appsec-stage-s11"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
appsec-model = { path = "../appsec-model" }
appsec-llm-client = { path = "../appsec-llm-client" }
appsec-llm-agentic = { path = "../appsec-llm-agentic" }
appsec-stage-s10 = { path = "../appsec-stage-s10" }
appsec-validation-scoring = { path = "../appsec-validation-scoring" }
appsec-json-repair = { path = "../appsec-json-repair" }
# For `FactTools`/`FACT_TOOL_NAMES`: the panel wraps the caller's read-only
# executor with the five deterministic fact tools per finding.
appsec-sandbox-tools = { path = "../appsec-sandbox-tools" }
appsec-yaml = { path = "../appsec-yaml" }
# `redact_diff` for the diff the panel sees, and redaction of persona
# evidence before it is bounded.
appsec-redact = { path = "../appsec-redact" }
# `--resume` checkpoints of computed scores (engine-keyed step ids).
appsec-checkpoint = { path = "../appsec-checkpoint" }
serde = { workspace = true }
sha1 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = { workspace = true }
tempfile = { workspace = true }

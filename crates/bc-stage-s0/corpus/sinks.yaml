  # ╔══════════════════════════════════════════════════════════════════╗
  # ║ PHP / Ruby / Rust — added 2026-09-07                             ║
  # ╚══════════════════════════════════════════════════════════════════╝
  #
  # These three were wired for their framework entry points only, so
  # every handler the route plane found led nowhere: no sink rule
  # existed for them at all. `scan::lite` gives them functions, calls
  # and a static-first-argument answer, which is everything a rule here
  # needs.
  #
  # Two shapes recur and are worth stating once. PHP's `$` sigil is part
  # of its variable token, not of the name a rule spells, so
  # `$pdo->query(...)` is written `pdo.query(...)`. And a receiver-less
  # `bare_call` is the normal shape in PHP and Ruby, where most of the
  # dangerous surface is a global function or an implicit-self method.
  #
  # Deliberately NOT expressible, for the record: PHP's
  # `include`/`require` are their own expression kind, not calls, and a
  # backtick shell is an operator; Rust's `unsafe` is a block, not a
  # call (the raw-pointer read inside it IS a call and is covered);
  # Rust's `query!`/`sqlx::query!` macro form binds its parameters and
  # is safe by construction, so only the function form is listed.
  - id: php.sql
    languages: [php]
    pattern-either:
      - pattern: mysqli_query(...)
      - pattern: mysql_query(...)
      - pattern: pg_query(...)
      - pattern: pdo.query(...)
      - pattern: pdo.exec(...)
      - pattern: db.query(...)
      - pattern: dbh.query(...)
      - pattern: conn.query(...)
      - pattern: DB.select(...)
      - pattern: DB.statement(...)
      - pattern: DB.raw(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: php.command-exec

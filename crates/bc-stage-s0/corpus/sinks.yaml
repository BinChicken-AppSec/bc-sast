  # ╔══════════════════════════════════════════════════════════════════╗
  # ║ C / C++ — added 2026-09-07                                       ║
  # ╚══════════════════════════════════════════════════════════════════╝
  #
  # C and C++ share ONE language key and one grammar: `ext_to_lang` maps
  # `.c`, `.h`, `.cpp`, `.cc`, `.cxx` and `.hpp` all onto `c-cpp`, and
  # C++'s tree-sitter grammar parses plain C. Every rule below therefore
  # claims both spellings, which `semgrep_to_vvah` folds back into that
  # one key.
  #
  # Deliberately NOT expressible, for the record: use-after-free is a
  # temporal property of one pointer across two statements, not a
  # source→sink pair, so the polyglot bed's `uaf-1` seed is left to S4's
  # own reasoning rather than faked as a rule here.
  #
  # Integer-overflow allocation IS expressible, and the
  # `alloc-size-overflow` rules below express it. It needs an arithmetic
  # predicate over an argument, which is the same kind of predicate the
  # format-string rules already use — `requires_dynamic_arg` asks
  # whether an argument is a literal, `requires_arithmetic_arg` asks
  # whether it is a `*`/`+` expression, `requires_unit_arg` asks whether
  # it is the integer literal `1` — so `malloc` can be named without
  # flagging every allocation in the program.
  #
  # C++'s array `new T[n]` is covered too. The grammar parses it as a
  # `new_expression` with no argument list at all, so the extractor
  # reads the `new_declarator`'s length as argument 0 and records the
  # allocation under the name C++ gives it, `operator_new_array`
  # (brackets spelled out, since a rule leaf must be an identifier).
  # `new T[n * m]` then meets the same predicate `malloc(n * m)` does.
  # The non-array `new T` and `new T(args)` allocate exactly one object,
  # have no size to compute, and are not recorded.
  #
  # `snprintf` is absent from the overflow family on purpose — it is the
  # BOUNDED alternative to `sprintf` and the fix a reviewer would
  # recommend; it appears only in the format-string family, where an
  # attacker-controlled format is dangerous whatever the bound.
  - id: c.buffer-overflow
    languages: [c, cpp]
    # The unbounded string operations. Each writes until it meets a NUL
    # in the SOURCE, so a destination sized for anything less overflows.
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: vsprintf(...)
      - pattern: gets(...)
      - pattern: stpcpy(...)
    metadata:
      cwe: CWE-121
      sink_kind: memory
      semantic_family: other
  - id: c.format-string
    languages: [c, cpp]
    # CWE-134: the format argument is not a literal, so an attacker who
    # controls it controls `%n` and the whole varargs walk.
    # `dynamic_arg_index` is what makes this precise — `printf` takes
    # its format first, `fprintf`/`sprintf` second, `snprintf` third —
    # and it is why a fixed-format `fprintf(stderr, "…")` is not
    # flagged.
    pattern-either:
      - pattern: printf(...)
      - pattern: vprintf(...)
      - pattern: syslog(...)
    metadata:
      cwe: CWE-134
      sink_kind: format
      semantic_family: other
      requires_dynamic_arg: true
  - id: c.format-string-second-arg
    languages: [c, cpp]
    pattern-either:
      - pattern: fprintf(...)
      - pattern: sprintf(...)
      - pattern: vfprintf(...)
      - pattern: vsprintf(...)
      - pattern: sscanf(...)
      - pattern: fscanf(...)
    metadata:
      cwe: CWE-134
      sink_kind: format
      semantic_family: other
      requires_dynamic_arg: true
      dynamic_arg_index: 1
  - id: c.format-string-third-arg
    languages: [c, cpp]
    pattern-either:
      - pattern: snprintf(...)
      - pattern: vsnprintf(...)
    metadata:
      cwe: CWE-134
      sink_kind: format
      semantic_family: other
      requires_dynamic_arg: true
      dynamic_arg_index: 2
  - id: c.command-exec
    languages: [c, cpp]
    pattern-either:
      - pattern: system(...)
      - pattern: popen(...)
      - pattern: execl(...)
      - pattern: execlp(...)
      - pattern: execle(...)
      - pattern: execv(...)
      - pattern: execvp(...)
      - pattern: execve(...)
      - pattern: std.system(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: c.alloc-size-overflow
    languages: [c, cpp]
    # CWE-190: the allocation size is COMPUTED at the call site, so an
    # attacker-derived operand can wrap the arithmetic and hand back a
    # buffer far smaller than the loop that fills it believes.
    # `malloc(count * size)` is the canonical shape;
    # `requires_arithmetic_arg` is what makes it precise, and it is why
    # `malloc(len)` — which allocates exactly what it was asked for and
    # cannot wrap — is not flagged. Without the predicate this rule
    # would have to report every allocation in the program, which is
    # why no allocation rule existed here before the predicate did.
    #
    # The predicate is syntactic: it asks whether the size argument is
    # COMPUTED, not whether it can actually overflow. An all-constant
    # `malloc(MAX * sizeof(row))` therefore matches. That is deliberate
    # and matches every other rule in this corpus — a rule proposes a
    # candidate and the taint path decides. Folding constants is not
    # possible here anyway: tree-sitter does not run the preprocessor, so
    # `MAX` is an identifier like any other.
    #
    # `calloc` is deliberately EXCLUDED from THIS rule, not merely
    # unlisted. `calloc(n, size)` is the SAFE idiom: it takes the two
    # factors apart and multiplies them internally with an overflow
    # check, and it is exactly the remediation a reviewer recommends for
    # `malloc(n * size)`. A scanner that flags the fix it just asked for
    # sends remediation in a circle, so a bare `requires_arithmetic_arg`
    # over `calloc` — which would report `calloc(len + 1, size)` and
    # every other correct call in the tree — stays out. The ONE
    # `calloc` shape that is genuinely unsafe has its own rule below,
    # `c.calloc-hand-multiplied-size`, which is narrow enough to keep
    # every idiomatic call unflagged.
    #
    # `operator_new_array` is C++'s `new T[n]`; see the family comment
    # above for why it is spelled that way. Its size is argument 0, the
    # same slot `malloc`'s is, so it needs no index of its own.
    #
    # Ordered BEFORE `c.unbounded-copy`, which also names `alloca`:
    # first match wins, so `alloca(n * m)` gets the precise CWE-190
    # verdict here and `alloca(len)` still falls through to CWE-787,
    # which is the right class for an unbounded stack allocation.
    pattern-either:
      - pattern: malloc(...)
      - pattern: alloca(...)
      - pattern: operator_new_array(...)
    metadata:
      cwe: CWE-190
      sink_kind: memory
      semantic_family: other
      requires_arithmetic_arg: true
  - id: c.alloc-size-overflow-second-arg
    languages: [c, cpp]
    # `realloc(ptr, n * size)` puts the computed size second, the same
    # reason the format-string family needs `dynamic_arg_index`.
    pattern-either:
      - pattern: realloc(...)
    metadata:
      cwe: CWE-190
      sink_kind: memory
      semantic_family: other
      requires_arithmetic_arg: true
      arithmetic_arg_index: 1
  - id: c.calloc-hand-multiplied-size
    languages: [c, cpp]
    # The one `calloc` shape that is not the safe idiom.
    # `calloc(n, size)` multiplies its two factors internally under an
    # overflow check; `calloc(n * size, 1)` does that multiply by hand
    # in the caller — where it can wrap silently — and then passes an
    # element size of `1`, which makes `calloc`'s own check a no-op.
    # The protection is thrown away by the call itself, and the fix is
    # to split the factors back apart.
    #
    # Both halves of that shape must hold, so the rule carries TWO
    # argument predicates: `requires_arithmetic_arg` at index 0 and
    # `requires_unit_arg` at index 1. A spec's predicates are ANDed, so
    # naming both is how a rule states a condition across two arguments
    # — no new matching machinery, and the rule still lives here rather
    # than as a `calloc` special case in the engine.
    #
    # That conjunction is what keeps the family's whole point intact.
    # `calloc(n, size)` fails the first predicate (a bare name is not
    # arithmetic). `calloc(len + 1, sizeof(char))` fails the second:
    # `sizeof(char)` IS one byte, but it names the element type instead
    # of asserting the caller already did the multiply, and it is the
    # textbook string allocation. `calloc(1, sizeof(x))` fails both.
    pattern-either:
      - pattern: calloc(...)
    metadata:
      cwe: CWE-190
      sink_kind: memory
      semantic_family: other
      requires_arithmetic_arg: true
      arithmetic_arg_index: 0
      requires_unit_arg: true
      unit_arg_index: 1
  - id: c.unbounded-copy
    languages: [c, cpp]
    # `memcpy(dst, src, n)` with an attacker-derived `n` is CWE-787.
    # The length is argument 2 and no call-shape rule can prove it
    # constant, so these are candidates rather than verdicts — the same
    # basis as `py.yaml-load`.
    pattern-either:
      - pattern: memcpy(...)
      - pattern: memmove(...)
      - pattern: alloca(...)
    metadata:
      cwe: CWE-787
      sink_kind: memory
      semantic_family: other
  - id: c.path-io
    languages: [c, cpp]
    pattern-either:
      - pattern: fopen(...)
      - pattern: freopen(...)
      - pattern: open(...)
      - pattern: unlink(...)
      - pattern: remove(...)
      - pattern: rename(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io


      - pattern: exec(...)
      - pattern: shell_exec(...)
      - pattern: system(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: php.file-io

  # ── file-io / path traversal (CWE-22) ───────────────────────────────
  - id: py.open-file
    languages: [python]
    # A bare-call shape. Parsed to nothing at all before the
    # `bare_call` category existed, so this rule never fired.
    pattern: open(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io
  - id: py.flask-send-file
    languages: [python]
    # `send_file` hands the client whatever path it is given, so a
    # request-derived filename is a directory traversal. Both import
    # styles are spelled out: `from flask import send_file` leaves the
    # call receiver-less (bare_call), `import flask` makes it
    # `flask.send_file(...)` (module_attr). `send_from_directory` is
    # deliberately absent — it resolves against a fixed base directory
    # and rejects escapes, which is the safe API to migrate to.
    pattern-either:
      - pattern: send_file(...)
      - pattern: flask.send_file(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io
  - id: go.os-open
    languages: [go]
    pattern-either:
      - pattern: os.Open(...)
      - pattern: os.OpenFile(...)
      - pattern: ioutil.ReadFile(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io

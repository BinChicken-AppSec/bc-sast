# S0 starter sink corpus — bundled default for `step0.enabled: true` when
# no custom `sinks_yaml` is configured. Not a port: the Python original's
# real `generic_pack.py`-produced corpus was never vendored anywhere in
# this repo, so this is hand-authored from scratch, not transcribed.
#
# Scope, deliberately bounded ("starter-sized", not exhaustive):
#   - Covers all 11 keys in `bc_callgraph::families::VVAH_LANGUAGES`:
#     the six with full extractors (python/java/javascript/typescript/
#     go/csharp) and the five on the lite path (php/ruby/kotlin/rust/
#     c-cpp, the last spelled `c` and `cpp` in a rule's `languages`
#     list). Java's rules also claim `kotlin`, since Kotlin calls the
#     same JVM APIs.
#   - Rules use four call shapes, all of which `bc_callgraph::rules`
#     parses and `bc_callgraph::scan::match_call` matches:
#       * "module_attr" — `<module>.<function>(...)`, the bulk of the file
#       * "qualified" — `codeql_pkg`/`codeql_class`/`$METHOD` metadata
#         (the two rules explicitly marked `codeql`), proven correct by
#         `load_rulepacks_parses_a_codeql_qualified_sink_rule`
#       * "bare_call" — `open(...)`, a receiver-less call
#       * "receiver_method" — `$CUR.execute(...)`, semgrep's own receiver
#         -metavariable syntax: any receiver, named method
#     The last two were added 2026-09-06. Before that, `open(...)` /
#     `eval(...)` / `exec(...)` parsed to *zero* match specs (the
#     module-attr regex requires a `.`), so `py.open-file`, `py.eval-exec`
#     and `js.eval` were silently dead; and instance-method sinks such as
#     `cursor.execute` were not expressible at all, which is why this file
#     used to carry a `sqlite3.connect(...)` proxy in their place.
#   - Every API named below is a real, standard-library or well-known-
#     framework function, not invented — cross-check against each
#     language's own documentation if extending this file.
#   - `semantic_family` values are the canonical set from
#     `bc_callgraph::families::CANONICAL_FAMILIES`.
#
# Re-verify/extend this file freely — it's a starting point, not a
# ceiling. See `crates/bc-stage-s0/corpus/sources.yaml` for the source
# -side counterpart, and `crates/bc-stage-s4/src/cwe_kb.rs` for the
# separate (CWE-guidance, not corpus) `CweKB` content.
rules:
  # ── command-exec (CWE-78) ──────────────────────────────────────────
  - id: py.os-system
    languages: [python]
    pattern: os.system(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: py.os-popen
    languages: [python]
    pattern: os.popen(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: py.subprocess-call
    languages: [python]
    pattern-either:
      - pattern: subprocess.call(...)
      - pattern: subprocess.run(...)
      - pattern: subprocess.Popen(...)
      - pattern: subprocess.check_output(...)
      - pattern: subprocess.check_call(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: js.child-process-exec
    languages: [javascript, typescript]
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: child_process.spawn(...)
      - pattern: child_process.spawnSync(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: go.exec-command
    languages: [go]
    pattern: exec.Command(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: java.codeql.runtime-exec
    languages: [java, kotlin]
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
      codeql_pkg: java.lang
      codeql_class: Runtime
    patterns:
      - metavariable-regex:
          metavariable: $METHOD
          regex: "^(exec)$"

  # ── sql-exec (CWE-89) ───────────────────────────────────────────────
  #
  # REMOVED 2026-09-06: `py.sqlite3-connect-execute`, `pattern:
  # sqlite3.connect(...)`. It was a documented proxy for the real
  # `cursor.execute(...)` sink, adopted only because the receiver-method
  # call shape could not be expressed. It was worse than nothing:
  # `sqlite3.connect(path)` takes a *database path*, never a query, so
  # the sink call site carried no query symbol and no Python SQL path
  # could ever ground in taint evidence — it produced a sink attributed
  # to whatever helper opened the connection (`db.py::_cursor` in the
  # 2026-09-06 field repro) and a permanent false negative on the real
  # injection two lines away. The receiver-method rule below replaces it.
  - id: py.dbapi-cursor-execute
    languages: [python]
    # DB-API 2.0 (`sqlite3`, `psycopg2`, `pymysql`, `cx_Oracle`, …) and
    # SQLAlchemy all expose query execution as an INSTANCE method on a
    # cursor/connection/session, so no `<module>.<attr>(...)` shape can
    # reach it.
    #
    # `requires_dynamic_arg` is what keeps this precise: a call whose
    # first positional argument is a *static* string literal is a
    # parameterized query — `cur.execute("… WHERE email LIKE ?",
    # (email,))` binds its values and is NOT an injection sink — while
    # `cur.execute("… LIKE '" + pattern + "'")` and `cur.execute(query)`
    # both are.
    pattern-either:
      - pattern: $CUR.execute(...)
      - pattern: $CUR.executemany(...)
      - pattern: $CUR.executescript(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: java.jdbc-statement-execute
    languages: [java, kotlin]
    # The `Statement.executeQuery` family the header used to call out as
    # deliberately omitted. `prepareStatement` is included because the
    # injection is in the *template* it is handed, not in the later
    # `setString` binds; a fully static template is filtered out by
    # `requires_dynamic_arg` exactly as it should be.
    pattern-either:
      - pattern: $ST.executeQuery(...)
      - pattern: $ST.executeUpdate(...)
      - pattern: $ST.prepareStatement(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
      # `statement.executeQuery()` with NO argument is the
      # `PreparedStatement` form: the SQL text was fixed when the
      # statement was prepared, so there is nothing at this call site to
      # inject into. Without this the parameterized query that every
      # JDBC tutorial teaches — and that the polyglot bed carries as its
      # deliberate negative control — reports as a SQL sink.
      requires_any_arg: true
  - id: cs.dbcommand-execute
    languages: [csharp]
    # ADO.NET. These usually take no argument at all (the SQL lives in
    # `cmd.CommandText`), which `requires_dynamic_arg` treats as dynamic
    # — there is no static literal at the call site to vouch for it.
    pattern-either:
      - pattern: $CMD.ExecuteReader(...)
      - pattern: $CMD.ExecuteNonQuery(...)
      - pattern: $CMD.ExecuteScalar(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║ C# — added 2026-09-07                                            ║
  # ╚══════════════════════════════════════════════════════════════════╝
  #
  # Before this block C# had exactly one rule in the whole corpus
  # (`cs.dbcommand-execute`, above) and — until the same day's source
  # additions — no source rule at all, so the language had extractors
  # that nothing could ever match against.
  #
  # Deliberately NOT expressible, for the record rather than by
  # oversight: `cmd.CommandText = sql` (an assignment to a property, not
  # a call, and the extractor's property-read call sites cover reads
  # only) and `searcher.Filter = f` for LDAP. The `new SqlCommand(sql,
  # conn)` and `new DirectorySearcher(filter)` constructors below are
  # the injection shapes that ARE call-shaped, and they carry the
  # attacker-controlled string as an argument, which is what the taint
  # plane needs.
  - id: cs.sqlcommand-ctor
    languages: [csharp]
    # `new SqlCommand(query, conn)` — the query template is argument 0.
    pattern-either:
      - pattern: SqlCommand(...)
      - pattern: MySqlCommand(...)
      - pattern: NpgsqlCommand(...)
      - pattern: OleDbCommand(...)
      - pattern: SqliteCommand(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: cs.ef-raw-sql
    languages: [csharp]
    # Entity Framework Core's escape hatches. `FromSqlInterpolated` /
    # `ExecuteSqlInterpolated` are the *safe* pair (they parameterize
    # the interpolation holes) and are deliberately absent.
    pattern-either:
      - pattern: $CTX.FromSqlRaw(...)
      - pattern: $CTX.ExecuteSqlRaw(...)
      - pattern: $CTX.ExecuteSqlRawAsync(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: cs.process-start
    languages: [csharp]
    pattern-either:
      - pattern: Process.Start(...)
      - pattern: ProcessStartInfo(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: cs.file-io
    languages: [csharp]
    # `Path.Combine` is listed because a request-derived segment makes
    # the *combined* path traversable; the read/write that follows is
    # the one that leaks, and both are here.
    pattern-either:
      - pattern: File.ReadAllText(...)
      - pattern: File.ReadAllBytes(...)
      - pattern: File.ReadAllLines(...)
      - pattern: File.WriteAllText(...)
      - pattern: File.WriteAllBytes(...)
      - pattern: File.Open(...)
      - pattern: File.OpenRead(...)
      - pattern: File.Delete(...)
      - pattern: Path.Combine(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io
  - id: cs.deserialize
    languages: [csharp]
    # `BinaryFormatter.Deserialize` is the classic .NET gadget chain
    # entry point. `JsonConvert.DeserializeObject` is only unsafe with
    # a `TypeNameHandling` other than `None`, which this extractor
    # cannot read off the settings argument — flagged as a candidate,
    # exactly as `py.yaml-load` is, and left for S4 to judge.
    pattern-either:
      - pattern: $F.Deserialize(...)
      - pattern: JsonConvert.DeserializeObject(...)
      - pattern: JavaScriptSerializer(...)
    metadata:
      cwe: CWE-502
      sink_kind: deserialize
      semantic_family: deserialization
  - id: cs.xxe
    languages: [csharp]
    # `XmlReader.Create` and `XmlDocument.LoadXml` are unsafe only with
    # DTD processing enabled, which lives on an `XmlReaderSettings`
    # this extractor cannot inspect — a candidate, not a verdict.
    pattern-either:
      - pattern: XmlReader.Create(...)
      - pattern: $DOC.LoadXml(...)
      - pattern: XmlTextReader(...)
    metadata:
      cwe: CWE-611
      sink_kind: xxe
      semantic_family: other
  - id: cs.http-fetch
    languages: [csharp]
    pattern-either:
      - pattern: $C.GetAsync(...)
      - pattern: $C.SendAsync(...)
      - pattern: $C.GetStringAsync(...)
      - pattern: $C.GetStreamAsync(...)
      - pattern: WebRequest.Create(...)
    metadata:
      cwe: CWE-918
      sink_kind: ssrf
      semantic_family: url-fetch
  - id: cs.open-redirect
    languages: [csharp]
    # ASP.NET MVC controller helpers. `LocalRedirect` is the safe one
    # and is absent.
    pattern-either:
      - pattern: Redirect(...)
      - pattern: RedirectPermanent(...)
    metadata:
      cwe: CWE-601
      sink_kind: redirect
      semantic_family: other
  - id: cs.ldap-search
    languages: [csharp]
    # `new DirectorySearcher(filter)` takes the LDAP filter as argument
    # 0; the `searcher.Filter = f` property form is not a call shape.
    pattern: DirectorySearcher(...)
    metadata:
      cwe: CWE-90
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: cs.weak-crypto
    languages: [csharp]
    pattern-either:
      - pattern: MD5.Create(...)
      - pattern: SHA1.Create(...)
      - pattern: DES.Create(...)
      - pattern: TripleDES.Create(...)
      - pattern: MD5CryptoServiceProvider(...)
      - pattern: SHA1CryptoServiceProvider(...)
      - pattern: DESCryptoServiceProvider(...)
    metadata:
      cwe: CWE-327
      sink_kind: crypto
      semantic_family: other

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║ Go — added 2026-09-07                                            ║
  # ╚══════════════════════════════════════════════════════════════════╝
  #
  # `go.exec-command`, `go.http-get` and `go.os-open` live in the
  # family-ordered sections further down; this block is everything else.
  #
  # A note on `database/sql`: `Query` and `Exec` are spelled as
  # module_attr rules bound to the conventional handle names
  # (`db`/`tx`/`conn`/`stmt`) rather than as receiver-method rules,
  # because a receiver-agnostic `$X.Query(...)` would also match
  # `r.URL.Query()` — net/http's query-string accessor, which this
  # corpus lists as a SOURCE. That pair would make every Go handler a
  # self-contained SQL injection. The `…Context`/`sqlx` variants below
  # have no such collision and are receiver-agnostic.
  - id: go.sql-handle-query
    languages: [go]
    pattern-either:
      - pattern: db.Query(...)
      - pattern: db.QueryRow(...)
      - pattern: db.Exec(...)
      - pattern: tx.Query(...)
      - pattern: tx.QueryRow(...)
      - pattern: tx.Exec(...)
      - pattern: conn.Query(...)
      - pattern: conn.Exec(...)
      - pattern: stmt.Query(...)
      - pattern: stmt.Exec(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: go.sql-context-and-sqlx
    languages: [go]
    pattern-either:
      - pattern: $DB.QueryContext(...)
      - pattern: $DB.QueryRowContext(...)
      - pattern: $DB.ExecContext(...)
      - pattern: $DB.Queryx(...)
      - pattern: $DB.QueryRowx(...)
      - pattern: $DB.NamedExec(...)
      - pattern: $DB.MustExec(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: go.exec-command-context
    languages: [go]
    pattern: exec.CommandContext(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: go.path-io
    languages: [go]
    # `os.Open`/`os.OpenFile`/`ioutil.ReadFile` are `go.os-open` in the
    # file-io section below; these are the rest of the family.
    pattern-either:
      - pattern: os.ReadFile(...)
      - pattern: os.Create(...)
      - pattern: os.WriteFile(...)
      - pattern: os.Remove(...)
      - pattern: ioutil.WriteFile(...)
      - pattern: filepath.Join(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io
  - id: go.http-client
    languages: [go]
    pattern-either:
      - pattern: http.NewRequest(...)
      - pattern: http.NewRequestWithContext(...)
      - pattern: http.Head(...)
      - pattern: http.PostForm(...)
      - pattern: $C.Do(...)
    metadata:
      cwe: CWE-918
      sink_kind: ssrf
      semantic_family: url-fetch
  - id: go.template-raw
    languages: [go]
    # `template.HTML`/`JS`/`URL`/`HTMLAttr` are html/template's explicit
    # "trust me, do not escape this" conversions.
    pattern-either:
      - pattern: template.HTML(...)
      - pattern: template.HTMLAttr(...)
      - pattern: template.JS(...)
      - pattern: template.URL(...)
    metadata:
      cwe: CWE-79
      sink_kind: xss
      semantic_family: html-response
  - id: go.open-redirect
    languages: [go]
    pattern: http.Redirect(...)
    metadata:
      cwe: CWE-601
      sink_kind: redirect
      semantic_family: other
  - id: go.weak-crypto
    languages: [go]
    pattern-either:
      - pattern: md5.New(...)
      - pattern: md5.Sum(...)
      - pattern: sha1.New(...)
      - pattern: sha1.Sum(...)
      - pattern: des.NewCipher(...)
      - pattern: rc4.NewCipher(...)
    metadata:
      cwe: CWE-327
      sink_kind: crypto
      semantic_family: other

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║ JavaScript / TypeScript — added 2026-09-07                       ║
  # ╚══════════════════════════════════════════════════════════════════╝
  #
  # `js.child-process-exec`, `js.fetch-like` and `js.eval` live in the
  # family-ordered sections further down; this block is everything else.
  #
  # The receiver-agnostic `$DB.query(...)` below is safe precisely
  # because `req.query` is a property READ, and a property read can
  # never match a sink rule (see `RawCall::property_read`) — otherwise
  # this one rule would make every Express handler a SQL injection.
  - id: js.db-query
    languages: [javascript, typescript]
    # `connection.query(sql)` (mysql/mysql2/pg), `sequelize.query(sql)`,
    # `knex.raw(sql)`. A `db.query("… WHERE id = ?", [id])` call is
    # parameterized and `requires_dynamic_arg` keeps it out.
    pattern-either:
      - pattern: $DB.query(...)
      - pattern: $DB.execute(...)
      - pattern: $DB.raw(...)
      - pattern: $DB.$queryRawUnsafe(...)
    metadata:
      cwe: CWE-89
      sink_kind: sql
      semantic_family: sql-exec
      requires_dynamic_arg: true
  - id: js.child-process-more
    languages: [javascript, typescript]
    # `const { exec } = require("child_process")` leaves the call
    # receiver-less, which the bare-call shapes cover. `spawn`/
    # `execFile` are only injectable with `shell: true`, which this
    # extractor cannot read off the options object — a candidate, not a
    # verdict, exactly as `py.yaml-load` is.
    pattern-either:
      - pattern: child_process.execFile(...)
      - pattern: child_process.execFileSync(...)
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: execFileSync(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: js.fs-path
    languages: [javascript, typescript]
    # `path.join` is deliberately absent: it composes a path rather than
    # opening one, and the composition is already visible to the taint
    # plane through the argument walk.
    pattern-either:
      - pattern: fs.readFile(...)
      - pattern: fs.readFileSync(...)
      - pattern: fs.writeFile(...)
      - pattern: fs.writeFileSync(...)
      - pattern: fs.createReadStream(...)
      - pattern: fs.createWriteStream(...)
      - pattern: fs.open(...)
      - pattern: fs.unlink(...)
      - pattern: $RES.sendFile(...)
    metadata:
      cwe: CWE-22
      sink_kind: path
      semantic_family: file-io
  - id: js.vm-eval
    languages: [javascript, typescript]
    # `eval(...)` is `js.eval` in the dyn-eval section below. `new
    # Function(code)` is NOT here: the extractor records no call site
    # for a `new` expression in JavaScript, so the rule would be dead.
    pattern-either:
      - pattern: vm.runInContext(...)
      - pattern: vm.runInNewContext(...)
      - pattern: vm.runInThisContext(...)
      - pattern: vm.compileFunction(...)
    metadata:
      cwe: CWE-95
      sink_kind: dyn-eval
      semantic_family: other
  - id: js.http-fetch
    languages: [javascript, typescript]
    pattern-either:
      - pattern: axios.request(...)
      - pattern: axios.put(...)
      - pattern: axios.delete(...)
      - pattern: http.get(...)
      - pattern: http.request(...)
      - pattern: https.get(...)
      - pattern: https.request(...)
      - pattern: fetch(...)
      - pattern: request(...)
    metadata:
      cwe: CWE-918
      sink_kind: ssrf
      semantic_family: url-fetch
  - id: js.open-redirect
    languages: [javascript, typescript]
    pattern: $RES.redirect(...)
    metadata:
      cwe: CWE-601
      sink_kind: redirect
      semantic_family: other
  - id: js.deserialize
    languages: [javascript, typescript]
    # `node-serialize`'s `unserialize` executes an embedded IIFE — the
    # classic Node RCE gadget. `yaml.load` without `{ schema:
    # JSON_SCHEMA }` (or js-yaml v4's safe default) is the same shape as
    # `py.yaml-load`, and is flagged on the same "candidate, not
    # verdict" basis.
    pattern-either:
      - pattern: serialize.unserialize(...)
      - pattern: unserialize(...)
      - pattern: yaml.load(...)
      - pattern: jsyaml.load(...)
    metadata:
      cwe: CWE-502
      sink_kind: deserialize
      semantic_family: deserialization
  - id: js.xxe
    languages: [javascript, typescript]
    # `libxmljs.parseXml(xml, { noent: true })` resolves entities; the
    # option itself is not readable from a call shape.
    pattern-either:
      - pattern: libxmljs.parseXml(...)
      - pattern: libxmljs.parseXmlString(...)
    metadata:
      cwe: CWE-611
      sink_kind: xxe
      semantic_family: other
  - id: js.weak-crypto
    languages: [javascript, typescript]
    # `crypto.createHash("md5")` — the algorithm is argument 0 and this
    # extractor cannot read a literal's value, so every `createHash` is
    # a candidate.
    pattern-either:
      - pattern: crypto.createHash(...)
      - pattern: crypto.createCipheriv(...)
    metadata:
      cwe: CWE-327
      sink_kind: crypto
      semantic_family: other

  # ╔══════════════════════════════════════════════════════════════════╗
  # ║ Java / Kotlin — added 2026-09-07                                 ║
  # ╚══════════════════════════════════════════════════════════════════╝
  #
  # `java.codeql.runtime-exec` and `java.jdbc-statement-execute` live in
  # the family-ordered sections; this block is everything else. Java had
  # two sink rules and one source rule, so a Spring app produced taint
  # paths for its SQL injection and nothing else.
  #
  # **Every rule here also claims `kotlin`.** Kotlin calls the same JVM
  # APIs by the same names, and `MatchSpec.languages` is a set the
  # matcher tests with `contains(language)` — so one rule covers both
  # the moment a Kotlin extractor is wired, with no second corpus to
  # keep in step. Rules are filtered against the operator's active
  # languages before they are ever indexed, so claiming a language with
  # no extractor yet costs nothing.
  #
  # Deliberately NOT expressible, for the record: `Pattern.compile` and
  # `XPathExpression.compile` are spelled identically, so an XPath
  # `compile(` rule would flag every regex in the repo — `evaluate(` is
  # the XPath-only half and is used instead. `HttpClient.send(` is
  # likewise dropped: `send` is far too common a method name to claim
  # receiver-agnostically, and the `URL`/`RestTemplate` shapes below
  # cover the same SSRF. Raw template rendering has no crisp Java call
  # signature; `bc_callgraph::scan::semantic_sink_override` already
  # catches the `response.getWriter().print(...)` HTML shape.
  - id: java.runtime-exec
    languages: [java, kotlin]
    # `Runtime.getRuntime().exec(cmd)` reduces to an `exec` call whose
    # leftmost identifier is `Runtime`. The existing
    # `java.codeql.runtime-exec` rule cannot match it: a qualified rule
    # needs the receiver to resolve through the import table, and
    # `java.lang.Runtime` is implicitly imported, so it never does.
    pattern-either:
      - pattern: Runtime.exec(...)
      - pattern: ProcessBuilder(...)
    metadata:
      cwe: CWE-78
      sink_kind: cmd
      semantic_family: command-exec
  - id: java.file-io
    languages: [java, kotlin]
    # `Path.resolve` is listed because resolving an unvalidated segment
    # against a trusted root IS the traversal; the read that follows is
    # what leaks, and both are here.
    pattern-either:
      - pattern: Files.readAllBytes(...)
      - pattern: Files.readAllLines(...)
      - pattern: Files.readString(...)
      - pattern: Files.newInputStream(...)
      - pattern: Files.newOutputStream(...)
      - pattern: Files.newBufferedReader(...)
      - pattern: Files.write(...)
      - pattern: Files.copy(...)
      - pattern: Files.delete(...)
      - pattern: Paths.get(...)
      - pattern: File(...)

[package]
name = "bc-stage-s6"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bc-redact = { path = "../bc-redact" }
tracing = { workspace = true }
bc-model = { path = "../bc-model" }
bc-pipeline-core = { path = "../bc-pipeline-core" }
bc-llm-client = { path = "../bc-llm-client" }
bc-llm-agentic = { path = "../bc-llm-agentic" }
bc-repo-analysis = { path = "../bc-repo-analysis" }
bc-cvss = { path = "../bc-cvss" }
bc-prompts = { path = "../bc-prompts" }
regex = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
# Test-only, and in this direction only (S5 does not depend on S6): the
# LANGUAGE FACTS block in `prompts.rs` states in prose the same rules
# `bc_stage_s5::lang_gates` and `::route_gates` decide mechanically, so two
# tests run those gates and assert the prompt agrees with their verdicts.
bc-stage-s5 = { path = "../bc-stage-s5" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
async-trait = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }

[package]
name = "bc-stage-s11"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bc-model = { path = "../bc-model" }
bc-llm-client = { path = "../bc-llm-client" }
bc-llm-agentic = { path = "../bc-llm-agentic" }
bc-stage-s10 = { path = "../bc-stage-s10" }
bc-validation-scoring = { path = "../bc-validation-scoring" }
bc-json-repair = { path = "../bc-json-repair" }
# For `FactTools`/`FACT_TOOL_NAMES`: the panel wraps the caller's read-only
# executor with the five deterministic fact tools per finding.
bc-sandbox-tools = { path = "../bc-sandbox-tools" }
bc-yaml = { path = "../bc-yaml" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = { workspace = true }
tempfile = { workspace = true }

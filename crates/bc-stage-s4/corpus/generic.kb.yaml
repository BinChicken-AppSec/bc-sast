# This file is a near-verbatim copy of vvaharness/rules/generic.kb.yaml,
# retained here with its original notice per Apache-2.0 section 4(c).
# Changes from the original are described in the comment below.
#
# S4's built-in CWE taint knowledge base — ported verbatim from
# `vvaharness/rules/generic.kb.yaml` (the Python original's own shipped
# default corpus). Per-CWE sources/sinks/sanitizers/non-sanitizers/
# false-positive-check guidance, spliced into the S4 confirm/refute
# prompt (`crates/bc-stage-s4/src/cwe_kb.rs`) so the verifier applies the
# same decision rules a human reviewer would, instead of relying on
# model recall.
#
# Not hand-authored: this is a direct port of the Python original's real
# data, not a fresh "starter" set — task #31's scope explicitly excludes
# the operator-supplied-overlay mechanism (`rules.kb_overlays` /
# `custom.kb.yaml`), so this is the only KB source in this port. Every
# sequence in this file is indented one level deeper than its parent key
# (`bc_yaml`'s block-sequence parser requires that; it doesn't support
# full YAML's same-indent dash style, unlike the Python original which
# used PyYAML's more permissive parser) — this is a reformat, the actual
# entries are unchanged.
#
# Several CWE ids intentionally appear more than once (CWE-117, CWE-22,
# CWE-306) — this is real upstream behavior, not a mistake: `CweKB`'s own
# merge-on-load semantics (see `cwe_kb.rs::merge_entry`) combine same-CWE
# entries into one slot (first non-empty title wins; every list field is
# unioned), covering more than one attack-surface angle for the same CWE
# id under a single umbrella (e.g. CWE-117 covers both raw log injection
# and unredacted-sensitive-data-in-logs).
entries:
  - cwe: CWE-89
    origin: generic
    title: SQL Injection
    sources:
      - user input, request params, form fields, query strings
      - path params, headers, JSON bodies, cookies
    sinks:
      - string-built SQL passed to execute/query/update
      - dynamic SQL fragments used for table, column, or ORDER BY names
      - 'python: cursor.execute'
      - 'java: Statement.executeQuery'
    sanitizers:
      - Parameterized queries / prepared statements
      - 'java: PreparedStatement'
      - server-side allow-lists for dynamic identifiers
    non_sanitizers:
      - manual escaping
      - regex blacklists for SQL keywords
    fp_checks:
      - taint reaches a bound parameter value, not the SQL string
      - query is fully static and only values are interpolated via binds
  - cwe: CWE-78
    origin: generic
    title: 'OWASP A03 Injection: command execution'
    sources:
      - user input, argv/env, request params, config values
    sinks:
      - shell invocation, Runtime.exec, Process.Start, child_process.exec
      - any string passed to a shell or eval-style command runner
    sanitizers:
      - argv-array execution with shell disabled
      - strict allow-list of commands and arguments
    non_sanitizers:
      - quoting only
      - blocking punctuation characters
    fp_checks:
      - command is constant and arguments are not attacker-controlled
  - cwe: CWE-79
    origin: generic
    title: 'OWASP A03 Injection: HTML / template output'
    sources:
      - HTTP input, comments, markdown, profiles, stored text
    sinks:
      - innerHTML, document.write, render_template_string, res.send(html)
      - template raw blocks, safe markers, triple-stache, Markup()
    sanitizers:
      - context-aware HTML encoding
      - template auto-escape that stays enabled end-to-end
    non_sanitizers:
      - strip_tags
      - URL encoding
      - JSON serialization
    fp_checks:
      - sink is textContent / innerText / JSON response
  - cwe: CWE-22
    origin: generic
    title: 'OWASP A01 Broken Access Control: path traversal'
    sources:
      - user-supplied filename, path, archive member, upload name
    sinks:
      - open/read/write/delete/sendFile/serveFile on attacker-influenced paths
    sanitizers:
      - canonicalize then verify inside a fixed base directory
      - server-side id to path mapping with no raw path joins
    non_sanitizers:
      - basename alone
      - single ../ replacement
      - prefix check before resolve
    fp_checks:
      - path is constant or fully server-derived
  - cwe: CWE-918
    origin: generic
    title: 'OWASP A10 SSRF: server-side URL fetch'
    sources:
      - user URL, webhook target, callback URL, redirect URL
    sinks:
      - requests/fetch/HttpClient/curl/file_get_contents on remote URLs
    sanitizers:
      - host allow-list after DNS resolution
      - private-range and loopback blocking on every hop
    non_sanitizers:
      - scheme allow-list only
      - string prefix checks on hosts
    fp_checks:
      - URL is fixed or drawn from a trusted allow-list
  - cwe: CWE-502
    origin: generic
    title: 'OWASP A08 Software / data integrity: unsafe deserialization'
    sources:
      - untrusted blob, file, message, cookie, session payload
    sinks:
      - pickle.loads, ObjectInputStream.readObject, BinaryFormatter.Deserialize
      - YAML/native object loaders that execute constructors or gadgets
    sanitizers:
      - safe_load / data-only parsing
      - class allow-list filters before object creation
    non_sanitizers:
      - signature check after deserialization
      - class-name blacklists
    fp_checks:
      - input is immutable trusted data and cannot be attacker-writable
  - cwe: CWE-611
    origin: generic
    title: 'OWASP A08 software integrity: XML external entity expansion'
    sources:
      - XML input from request, file, message, or partner system
    sinks:
      - XML parsers with DTD/entity resolution enabled
    sanitizers:
      - disable DTDs and external entities before parsing
    non_sanitizers:
      - post-parse exception handling
      - schema validation alone
    fp_checks:
      - defused XML parser or equivalent hardened factory is used
  - cwe: CWE-601
    origin: generic
    title: 'OWASP A01 Broken Access Control: open redirect'
    sources:
      - next, returnUrl, redirect, callback, destination parameters
    sinks:
      - response redirects and client-side navigation sinks
    sanitizers:
      - relative-path allow-list or exact host allow-list
    non_sanitizers:
      - startswith('/')
      - substring host checks
    fp_checks:
      - redirect target is fully server constant
  - cwe: CWE-117
    origin: generic
    title: 'OWASP A09 logging / monitoring: log injection'
    sources:
      - user-controlled strings, headers, stack traces, request bodies
    sinks:
      - raw log lines, audit events, CSV export of logs
    sanitizers:
      - structured logging with escaping or field separation
    non_sanitizers:
      - trimming
      - length checks
      - removing a few delimiters
    fp_checks:
      - output is structured and encoded before log emission
  - cwe: CWE-352
    origin: generic
    title: 'OWASP A01 / session integrity: CSRF on state-changing actions'
    sources:
      - browser-originated requests, forms, fetches, cookies
    sinks:
      - state-changing endpoints without anti-CSRF verification
    sanitizers:
      - anti-CSRF token or same-site gate checked on every state change
    non_sanitizers:
      - custom header names only
      - Referer check alone
    fp_checks:
      - action is read-only or token is required and validated
  - cwe: CWE-306
    origin: generic
    title: 'OWASP A07 authentication: missing auth check'
    sources:
      - public route, anonymous request, unauthenticated job trigger
    sinks:
      - privileged endpoint or command without authentication gate
    sanitizers:
      - authentication required before the sensitive action
    non_sanitizers:
      - UI-only restriction
      - client-side gating
    fp_checks:
      - route is internal-only and unreachable from any external entry point
  - cwe: CWE-862
    origin: generic
    title: 'OWASP A01 broken access control: missing authorization'
    sources:
      - tenant id, object id, row id, account id, URL path id
    sinks:
      - object access without ownership / role / policy checks
    sanitizers:
      - server-side authorization check tied to the resource
    non_sanitizers:
      - hiding the id from the UI
      - guessable ids are not enough
    fp_checks:
      - resource is global or intentionally public
  - cwe: CWE-639
    origin: generic
    title: 'OWASP A01 broken access control: IDOR / object reference'
    sources:
      - object identifiers from request path, query, or body
    sinks:
      - fetch/update/delete of another user's object
    sanitizers:
      - ownership lookup against authenticated principal
    non_sanitizers:
      - UUIDs alone
      - random ids alone
    fp_checks:
      - identifier is scoped by server-side tenant context before use
  - cwe: CWE-20
    origin: generic
    title: 'OWASP A04 insecure design: missing input validation'
    sources:
      - any untrusted field crossing a trust boundary
    sinks:
      - security-sensitive business logic consuming unchecked input
    sanitizers:
      - strict type, range, format, and allow-list validation
    non_sanitizers:
      - null checks
      - length checks only
    fp_checks:
      - all attacker-controlled inputs are normalized and validated before use
  - cwe: CWE-327
    origin: generic
    title: 'OWASP A02 cryptographic failures: weak or broken crypto'
    sources:
      - secrets, credentials, tokens, PII, payment data
    sinks:
      - MD5/SHA1 for security, hard-coded IVs, obsolete protocols
    sanitizers:
      - modern authenticated encryption and strong hash choices
    non_sanitizers:
      - HMAC with weak hash
      - password hashing with unsalted fast hash
    fp_checks:
      - crypto is legacy-only and not used for security decisions
  - cwe: CWE-295
    origin: generic
    title: 'OWASP A02 transport: TLS verification disabled'
    sources:
      - client configuration, deployment config, README instructions
    sinks:
      - verify=false, rejectUnauthorized=false, InsecureSkipVerify
    sanitizers:
      - TLS verification enabled with trusted CA / pinning policy
    non_sanitizers:
      - accepting any certificate
      - environmental trust without verification
    fp_checks:
      - dev-only harness or isolated test fixture that never ships
  - cwe: CWE-798
    origin: generic
    title: 'OWASP A02 credentials: hardcoded secret or token'
    sources:
      - source code literals, checked-in configs, fixtures, docs
    sinks:
      - API keys, passwords, JWTs, private keys, cloud credentials
    sanitizers:
      - secret manager lookup or runtime injection from secure storage
    non_sanitizers:
      - base64 encoding
      - renaming the variable
    fp_checks:
      - string is clearly a non-secret placeholder or a public example token
  - cwe: CWE-434
    origin: generic
    title: 'OWASP A05 misconfiguration: unrestricted file upload'
    sources:
      - user file uploads, multipart forms, drag-and-drop files
    sinks:
      - storage or execution of uploaded content without validation
    sanitizers:
      - type / extension / size allow-lists and safe storage outside web root
    non_sanitizers:
      - extension blacklists
      - MIME type alone
    fp_checks:
      - upload is converted to inert data or stored under a non-executable path
  - cwe: CWE-1333
    origin: generic
    title: 'OWASP A04 availability: regex denial of service'
    sources:
      - attacker-controlled text evaluated by complex regex
    sinks:
      - catastrophic-backtracking patterns in search / validation
    sanitizers:
      - linear-time regex or bounded matching with input limits
    non_sanitizers:
      - short-circuit checks that still leave the bad regex path
    fp_checks:
      - pattern is precompiled and not evaluated on attacker-controlled length
  - cwe: CWE-400
    origin: generic
    title: 'OWASP A04 availability: unbounded resource consumption'
    sources:
      - user-controlled pagination, loops, recursion, batch size, uploads
    sinks:
      - CPU / memory / disk amplification without hard caps
    sanitizers:
      - server-side quotas, paging limits, timeouts, and bounded queues
    non_sanitizers:
      - client hints
      - best-effort throttling
    fp_checks:
      - resource use is bounded by server-enforced limits
  - cwe: CWE-94
    origin: generic
    title: 'OWASP A03 injection: code / expression evaluation'
    sources:
      - template fragments, user expressions, rule text, scripts
    sinks:
      - eval, exec, ScriptEngine, new Function, template eval
    sanitizers:
      - literal allow-lists and sandboxed expression engines
    non_sanitizers:
      - character stripping
      - blacklists
      - string concatenation
    fp_checks:
      - expression is fully authored by trusted code and never data-derived
  - cwe: CWE-117
    origin: generic
    title: 'OWASP A09 observability: sensitive data in logs'
    sources:
      - PII, PAN, tokens, secrets, debug traces
    sinks:
      - logs, metrics tags, tracing spans, error telemetry
    sanitizers:
      - redaction before write, field-level masking, structured fields
    non_sanitizers:
      - manual truncation
      - suffix masking only
    fp_checks:
      - sensitive fields are redacted before emission
  - cwe: CWE-200
    origin: generic
    title: OWASP A01 / A02 information exposure
    sources:
      - stack traces, debug flags, config dumps, internal ids
    sinks:
      - public responses, error pages, diagnostic endpoints
    sanitizers:
      - least-information responses and internal-only diagnostics
    non_sanitizers:
      - hiding the UI button
      - client-side only protections
    fp_checks:
      - response is explicitly internal and inaccessible to external actors
  - cwe: CWE-22
    origin: generic
    title: 'OWASP A01 broken access control: archive / path member traversal'
    sources:
      - zip member names, tar entries, upload names, import paths
    sinks:
      - file extraction or access using raw member names
    sanitizers:
      - member name normalization and base-dir checks
    non_sanitizers:
      - single-pass replacement of '../'
      - basename alone
    fp_checks:
      - archive members are validated against a fixed extraction root
  - cwe: CWE-269
    origin: generic
    title: 'OWASP A01 privilege issue: over-privileged action'
    sources:
      - privileged command, admin endpoint, service token, host OS action
    sinks:
      - write/delete/execute beyond the caller's privilege boundary
    sanitizers:
      - least-privilege execution / role enforcement / policy checks
    non_sanitizers:
      - UI hints
      - obscurity
      - self-declared role strings
    fp_checks:
      - operation is already confined to the caller's minimal privilege
  - cwe: CWE-306
    origin: generic
    title: 'OWASP A07 auth: unauthenticated control plane action'
    sources:
      - scheduler jobs, webhooks, admin APIs, CLI switches
    sinks:
      - sensitive control plane operations without auth
    sanitizers:
      - auth gate plus server-side permission check
    non_sanitizers:
      - hidden routes
      - unguarded localhost assumptions
    fp_checks:
      - endpoint is unreachable from any untrusted entry point
  - cwe: CWE-326
    origin: generic
    title: 'OWASP A02 cryptography: insufficient encryption strength'
    sources:
      - data at rest, data in transit, long-lived tokens
    sinks:
      - weak algorithms, truncated keys, low-entropy secrets
    sanitizers:
      - strong modern algorithm and key-size choices
    non_sanitizers:
      - homegrown crypto
      - security through obscurity
    fp_checks:
      - algorithm is non-security legacy only

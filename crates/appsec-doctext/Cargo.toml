[package]
name = "appsec-doctext"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# No dependencies. Not "few" -- none.
#
# This crate parses attacker-controlled binary input, so its dependency
# list is its attack surface. The three things it needs are a DEFLATE
# decoder, a ZIP central-directory reader and an XML text extractor, and
# each is either a frozen specification or a deliberately reduced subset
# of one. See the module docs in `src/lib.rs` for why each is written
# here rather than taken from crates.io, including the vetting that was
# done on the alternatives before that decision was made.
[dependencies]

[dev-dependencies]
# Fixtures are generated by `tests/generate_fixtures.py` (Python's own
# zlib and zipfile) and committed as bytes. That is a test-authoring
# tool, not a dependency: nothing at build or run time needs it.

[package]
name = "appsec-sandbox-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
appsec-llm-client = { path = "../appsec-llm-client" }
appsec-pathjail = { path = "../appsec-pathjail" }
appsec-redact = { path = "../appsec-redact" }
# For DEFAULT_EXCLUDE_DIRS/DEFAULT_EXCLUDE_EXTS only: the fact tools' scan
# scope must be the production walk's scope, exactly as Python's
# `validation/tools/_scope.py` imports s1_preprocess's own exclude sets
# rather than restating them.
appsec-repo-analysis = { path = "../appsec-repo-analysis" }
serde_json = { workspace = true }
regex = { workspace = true }
# The ported `_SECRET_RX` needs negative lookahead, which `regex` refuses.
fancy-regex = { workspace = true }
glob = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

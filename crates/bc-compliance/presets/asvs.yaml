# OWASP ASVS v5.0.0 built-in compliance preset.
#
# Maps this tool's own detected-vulnerability CWEs (the complete set
# `bc-cwe` recognizes by name, crates/bc-cwe/src/lib.rs::lookup_name) to
# OWASP Application Security Verification Standard v5.0.0 (May 2025)
# requirement IDs. This is a DIFFERENT document from
# docs/compliance/CONTROL_MAPPING.md, which maps this TOOL's own security
# posture to external standards, not detected findings in a scanned repo
# — cited here only for its citation-rigor bar (primary sources, explicit
# gaps, never a fabricated ID), which this file follows.
#
# Primary source: github.com/OWASP/ASVS, v5.0.0 tag, 5.0/en/*.md — fetched
# and grepped directly against the raw chapter markdown (not paraphrased
# from training-data memory), verified 2026-08-27. IMPORTANT: v5.0.0
# substantially renumbered every requirement versus ASVS 4.x — there is
# no dedicated "Architecture" chapter any more (V1 is now "Encoding and
# Sanitization"; V15 "Secure Coding and Architecture" is the closest
# analog for dangerous-functionality guidance). Chapters consulted: V1
# Encoding & Sanitization, V2 Validation & Business Logic, V3 Web
# Frontend Security, V4 API & Web Service, V5 File Handling, V6
# Authentication, V7 Session Management, V8 Authorization, V9
# Self-contained Tokens, V11 Cryptography, V12 Secure Communication, V13
# Configuration, V14 Data Protection, V15 Secure Coding & Architecture,
# V16 Security Logging & Error Handling. V10 (OAuth/OIDC) and V17
# (WebRTC) were checked for scope and confirmed to contain no additional
# CWEs from the input list.
#
# Re-verify whenever ASVS publishes a new version — v5.0.0's own
# renumbering is exactly the kind of change that silently invalidates a
# stale crosswalk if not re-checked.
#
# CWEs with NO direct ASVS v5.0.0 match, deliberately excluded below
# rather than force-fit into a nearby bucket (a wrong control ID is worse
# than none):
#   - CWE-276 (Incorrect Default Permissions): OS/filesystem
#     permission-bit issue; ASVS is scoped to application/API behavior,
#     not POSIX permission bits.
#   - CWE-426 (Untrusted Search Path): DLL/library search-path hijacking
#     (native-binary/OS loader concern) — distinct from V5.3.2's
#     data-file-path jailing, which is about untrusted filenames, not the
#     dynamic linker's module search order.
#   - CWE-476 (NULL Pointer Dereference): a crash/reliability bug, not an
#     appsec control ASVS addresses (V1.4's memory-safety items cover
#     overflow/UAF/integer-overflow but not null-deref specifically).
#   - CWE-732 (Incorrect Permission Assignment for Critical Resource):
#     OS/filesystem/cloud-resource ACL misconfiguration — CSPM/IaC
#     territory, outside ASVS's appsec scope.
#
# A few mappings below are flagged in-line as general/imperfect fits
# rather than exact matches (matching CONTROL_MAPPING.md's own practice
# of citing a real but broad requirement when no narrower one exists):
# CWE-269 -> V13.2.2 (that item is specifically about backend-service
# least privilege, not general code-level privilege drop/escalation);
# CWE-306 -> V6.3.3/V7.5.3 (both operate at whole-app/session-sensitivity
# level, not the classic "one specific endpoint lacks auth" case); CWE-668
# -> V8.4.1 (a broad parent CWE, mapped to ASVS's multi-tenant item
# specifically); CWE-284 -> V8.2.1 (the parent of CWE-285/862/863,
# converging on the same function-level-access-control item as its
# children). Kept rather than omitted since each is a real, cited
# requirement — just a broader fit than the "exact" rows.
name: "OWASP ASVS v5.0.0"
guidance: |
  Findings are being evaluated for relevance to the OWASP Application
  Security Verification Standard (ASVS) v5.0.0. Prioritize confirming
  injection (SQL/OS command/LDAP/XPath/code-eval), SSRF, path traversal,
  deserialization of untrusted data, broken access control/authorization
  (including IDOR/BOLA), authentication and session-management weaknesses,
  and cryptographic control failures — these map directly to ASVS's most
  frequently cited requirements. When a finding's CWE or vulnerability
  class doesn't clearly map to a specific ASVS requirement, still report
  it; ASVS relevance is a prioritization signal, not a completeness gate.
scope_mode: annotate
requirements:
